# Custom Command Toggle 
# Initial Testing Configuration
# 
#
[Toggle 1]
button-name=My Button 1
icon=1-on-symbolic, 1-off-symbolic
toggle-on-command=~/test-script start
toggle-off-command=~/test-script stop
check-status-command=~/test-script status
search-term=enabled
initial-state=2
run-at-startup=false
startup-delay-time=2
check-status-delay-time=3
button-click-action=2
check-exit-code=false
show-indicator=true
close-menu=false
command-sync=false
polling-frequency=5
keyboard-shortcut=<Control>KP_1
enabled=true
menu-items=[{"name":"Toggle 1 ON command","icon":"1-on-symbolic","command":"~/test-script start"},{"name":"Toggle 1 OFF command","icon":"1-off-symbolic","command":"~/test-script stop"}]

